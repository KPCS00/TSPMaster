services:
  tspmaster:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATA_FILE=/app/data/tsp_share_prices.csv
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - NEWS_PROVIDER=${NEWS_PROVIDER:-none}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
